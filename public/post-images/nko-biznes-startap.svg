<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t">
  <title id="t">НКО, бизнес и стартап — каждый ищет донора, чьи интересы совпадают с его собственной целью</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F7A4D"/><stop offset="1" stop-color="#3DBE86"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F2A1E" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#F7FBF4"/>
  <g filter="url(#blur)" opacity="0.55">
    <circle cx="130" cy="90" r="170" fill="#5BD6A0"/>
    <circle cx="1090" cy="560" r="190" fill="#3DBE86"/>
    <circle cx="640" cy="40" r="100" fill="#FFB020" opacity="0.4"/>
  </g>

  <!-- connector lines from 3 cards to center -->
  <path d="M250 150 C 420 150, 480 230, 560 270" fill="none" stroke="#1F7A4D" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  <path d="M250 315 H 560" fill="none" stroke="#1F7A4D" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  <path d="M250 480 C 420 480, 480 400, 560 360" fill="none" stroke="#1F7A4D" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

  <!-- card: NGO -->
  <g filter="url(#sh)"><rect x="60" y="95" width="190" height="110" rx="22" fill="#fff" stroke="#D6E6DA" stroke-width="2"/></g>
  <circle cx="110" cy="150" r="30" fill="#EAF4EC"/>
  <path d="M110 136 C 100 126, 86 134, 88 148 C 90 160, 110 172, 110 172 C 110 172, 130 160, 132 148 C 134 134, 120 126, 110 136 Z" fill="none" stroke="#1F7A4D" stroke-width="4" stroke-linejoin="round"/>
  <rect x="152" y="138" width="76" height="9" rx="4.5" fill="#D6E6DA"/>
  <rect x="152" y="156" width="56" height="8" rx="4" fill="#EAF4EC"/>

  <!-- card: business -->
  <g filter="url(#sh)"><rect x="60" y="260" width="190" height="110" rx="22" fill="#fff" stroke="#D6E6DA" stroke-width="2"/></g>
  <circle cx="110" cy="315" r="30" fill="#EAF4EC"/>
  <g fill="none" stroke="#1F7A4D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="96" y="308" width="28" height="20" rx="3"/>
    <path d="M103 308 V302 C103 298 106 296 110 296 C114 296 117 298 117 302 V308"/>
  </g>
  <rect x="152" y="303" width="76" height="9" rx="4.5" fill="#D6E6DA"/>
  <rect x="152" y="321" width="56" height="8" rx="4" fill="#EAF4EC"/>

  <!-- card: startup -->
  <g filter="url(#sh)"><rect x="60" y="425" width="190" height="110" rx="22" fill="#fff" stroke="#D6E6DA" stroke-width="2"/></g>
  <circle cx="110" cy="480" r="30" fill="#EAF4EC"/>
  <path d="M110 462 C 120 468, 124 480, 118 494 L 110 500 L 102 494 C 96 480, 100 468, 110 462 Z" fill="none" stroke="#1F7A4D" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="110" cy="476" r="4" fill="#1F7A4D"/>
  <path d="M103 494 L96 502 M117 494 L124 502" stroke="#1F7A4D" stroke-width="4" stroke-linecap="round"/>
  <rect x="152" y="468" width="76" height="9" rx="4.5" fill="#D6E6DA"/>
  <rect x="152" y="486" width="56" height="8" rx="4" fill="#EAF4EC"/>

  <!-- overlapping circles: own mission vs donor interest -->
  <circle cx="660" cy="315" r="135" fill="#5BD6A0" opacity="0.28"/>
  <circle cx="820" cy="315" r="135" fill="#1F7A4D" opacity="0.28"/>
  <circle cx="660" cy="315" r="135" fill="none" stroke="#1F7A4D" stroke-width="3"/>
  <circle cx="820" cy="315" r="135" fill="none" stroke="#1F7A4D" stroke-width="3"/>

  <!-- left circle icon: flag / own mission -->
  <g fill="none" stroke="#0F2A1E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <path d="M600 260 V 380"/>
    <path d="M600 262 C 625 250, 645 272, 670 260 V 300 C 645 312, 625 290, 600 302 Z" fill="#F7FBF4"/>
  </g>

  <!-- right circle icon: document / donor -->
  <g fill="none" stroke="#0F2A1E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
    <rect x="845" y="260" width="68" height="90" rx="8" fill="#F7FBF4"/>
    <path d="M860 282 H898 M860 300 H898 M860 318 H885"/>
  </g>

  <!-- overlap: check mark badge -->
  <g filter="url(#sh)"><circle cx="740" cy="315" r="46" fill="url(#g)"/></g>
  <path d="M718 315 L734 331 L764 299" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="1100" cy="130" r="10" fill="#FFB020" opacity="0.6"/>
  <circle cx="990" cy="540" r="9" fill="#3DBE86" opacity="0.6"/>
  <circle cx="40" cy="560" r="7" fill="#5BD6A0" opacity="0.6"/>
</svg>
